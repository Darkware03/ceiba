# CEIBA — servidor estático de la SPA (contenedor `web`).
#
# [NO VERIFICADO] No ejecutado aquí. Se carga dentro del `http {}` de la
# configuración por defecto de la imagen oficial de Nginx, en
# /etc/nginx/conf.d/default.conf.

server {
    listen      8080;
    listen      [::]:8080;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Vite emite los artefactos con hash en el nombre: son inmutables y se
    # pueden cachear un año sin riesgo de servir una versión vieja.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        access_log off;
    }

    # index.html NUNCA se cachea: es lo que apunta a los artefactos con hash.
    # Si se cachea, un despliegue nuevo sirve HTML viejo que pide ficheros que
    # ya no existen, y la aplicación se queda en blanco.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate" always;
    }

    # Enrutado del lado del cliente (Vue Router en modo history): cualquier
    # ruta desconocida devuelve index.html y decide el navegador.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
