# CEIBA — Nginx, configuración principal del proxy inverso.
#
# [NO VERIFICADO] `nginx -t` NO se ha ejecutado sobre este fichero en el
# contenedor donde se escribió: no hay binario de Nginx ni Docker. La
# comprobación real está horneada en `infra/docker/proxy.Dockerfile` (ejecuta
# `nginx -t` durante el build) y repetida en CI. Ver DESPLIEGUE.md §6.

user  nginx;
worker_processes auto;
worker_rlimit_nofile 16384;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  4096;
    multi_accept        on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # No publiques la versión de Nginx en cabeceras ni en páginas de error.
    server_tokens off;

    # -----------------------------------------------------------------------
    # Registro
    # -----------------------------------------------------------------------
    # Se registra $uri, NO $request. Es deliberado: $request incluye la cadena
    # de consulta, y los códigos de colecciones privadas y los tokens no pueden
    # acabar en un fichero de log (C-SHARE: «nunca en logs ni en URLs»).
    log_format ceiba escape=json
        '{'
          '"ts":"$time_iso8601",'
          '"remote":"$remote_addr",'
          '"xff":"$http_x_forwarded_for",'
          '"method":"$request_method",'
          # $uri y NO $request: $request arrastra la cadena de consulta.
          # Aun así, $uri puede contener identificadores del camino, así que
          # la regla para la API es que NINGÚN secreto viaje en la ruta.
          '"uri":"$uri",'
          '"status":$status,'
          '"bytes":$body_bytes_sent,'
          '"rt":$request_time,'
          '"urt":"$upstream_response_time",'
          '"ua":"$http_user_agent",'
          '"proto":"$server_protocol",'
          '"scheme":"$scheme",'
          '"host":"$host",'
          '"req_id":"$request_id"'
        '}';

    access_log /var/log/nginx/access.log ceiba;

    # -----------------------------------------------------------------------
    # Transferencia
    # -----------------------------------------------------------------------
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65s;
    reset_timedout_connection on;

    # Debe ser >= CEIBA_MAX_UPLOAD_BYTES (26214400 = 25 MiB en .env.example).
    # Si Nginx corta antes que la API, el usuario ve un 413 de Nginx en vez del
    # error de dominio de CEIBA, y el límite real deja de ser el configurado.
    client_max_body_size      26m;
    client_body_timeout       60s;
    client_header_timeout     20s;
    large_client_header_buffers 4 16k;

    # gzip sólo para tipos estáticos. NO se comprime `application/json`: con
    # respuestas autenticadas que reflejan entrada del usuario, la compresión
    # es la precondición de BREACH, y la API devuelve testigos CSRF.
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_min_length   1024;
    gzip_comp_level   5;
    gzip_types        text/plain text/css text/javascript application/javascript
                      application/xml image/svg+xml application/manifest+json;

    # DNS interno de Docker.
    #
    # OJO, Y ESTO SE MALINTERPRETA SIEMPRE: `resolver` NO hace que un
    # `upstream { server api:3000; }` se vuelva a resolver. Eso exige el
    # parámetro `resolve`, que es exclusivo de NGINX Plus. Los upstream de
    # abajo se resuelven UNA VEZ, al arrancar.
    # Consecuencia operativa real: si se recrea el contenedor `api` y Docker
    # le asigna otra IP, el proxy seguirá enviando a la IP vieja y devolverá
    # 502 hasta que alguien recargue:
    #     docker compose exec proxy nginx -s reload
    # Está en el procedimiento de despliegue (DESPLIEGUE.md §5.2).
    resolver 127.0.0.11 valid=30s ipv6=off;
    resolver_timeout 5s;

    # -----------------------------------------------------------------------
    # WebSocket — ADR-0005
    # -----------------------------------------------------------------------
    # Socket.IO corre con `transports: ['websocket']`, sin long-polling. Eso
    # significa UNA conexión persistente por cliente y, en consecuencia, que
    # NO hacen falta sticky sessions: cualquier instancia sirve a cualquier
    # cliente. Por eso aquí NO hay `ip_hash` ni `hash $cookie_...`, y no debe
    # añadirse: ataría el escalado a esta configuración (ADR-0005 §2).
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # -----------------------------------------------------------------------
    # Esquema reenviado — decisión C-31
    # -----------------------------------------------------------------------
    # Por defecto, el esquema REAL de esta conexión. No se confía en lo que
    # mande el cliente: `X-Forwarded-Proto: https` enviado por http haría que
    # la API creyera estar tras TLS y emitiera cookies `Secure` por un canal en
    # claro, o peor, que decidiera no emitirlas.
    #
    # Si CEIBA va detrás de un balanceador que YA termina TLS (HTTPS LB de GCP,
    # Cloud Armor), sustituye este map por el de `snippets/behind-lb.conf.example`
    # Y configura allí `set_real_ip_from` con los rangos del balanceador. Sin
    # las dos cosas a la vez, la cabecera es falsificable.
    map $scheme $ceiba_forwarded_proto {
        default $scheme;
    }

    # -----------------------------------------------------------------------
    # Límites de petición
    # -----------------------------------------------------------------------
    limit_req_zone  $binary_remote_addr zone=ceiba_api:10m   rate=20r/s;
    limit_req_zone  $binary_remote_addr zone=ceiba_auth:10m  rate=1r/s;
    limit_req_zone  $binary_remote_addr zone=ceiba_share:10m rate=1r/s;
    limit_conn_zone $binary_remote_addr zone=ceiba_conn:10m;
    limit_req_status  429;
    limit_conn_status 429;

    # -----------------------------------------------------------------------
    # Upstreams
    # -----------------------------------------------------------------------
    # OJO: Nginx resuelve estos nombres AL ARRANCAR. Si `api` o `web` no están
    # levantados, el proxy no arranca. Por eso compose.yaml declara
    # `depends_on: condition: service_healthy` para ambos.
    #
    # EL MOTOR NO APARECE AQUÍ, Y NO DEBE APARECER NUNCA. El motor sólo lo
    # habla la API por la red interna `engine_link` (decisión C-25, regla 5 de
    # la cabecera de `compose.yaml`). Publicarlo por el proxy convertiría a
    # CEIBA en un proxy de salida abierto a Internet.
    upstream ceiba_api {
        server api:3000 max_fails=3 fail_timeout=10s;
        keepalive 32;
        keepalive_timeout 60s;
    }

    upstream ceiba_web {
        server web:8080 max_fails=3 fail_timeout=10s;
        keepalive 16;
    }

    include /etc/nginx/conf.d/*.conf;
}
