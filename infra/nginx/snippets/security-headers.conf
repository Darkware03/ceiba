# CEIBA — cabeceras de seguridad de la respuesta.
#
# [NO VERIFICADO] No ejecutado: no hay Nginx ni navegador disponible aquí.
#
# CUIDADO CON `add_header`: en Nginx, un `add_header` dentro de un `location`
# DESCARTA todos los heredados del `server`. Por eso este fichero se incluye a
# nivel de `server` y los `location` de `conf.d/ceiba.conf` no usan
# `add_header`. Si alguna vez hace falta uno dentro de un location, hay que
# volver a incluir este fichero ahí.

# HSTS. `always` para que también se emita en respuestas de error.
# No se incluye `preload`: enviar a la lista de precarga es irreversible en la
# práctica y debe ser una decisión consciente del cliente, no un efecto
# colateral de una plantilla.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

add_header X-Content-Type-Options    "nosniff" always;
add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
add_header X-Frame-Options           "DENY" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;

# Nada de esto lo necesita una herramienta de APIs.
add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;

# -----------------------------------------------------------------------
# CSP — [REQUIERE VALIDACIÓN CONTRA EL FRONTEND REAL]
# -----------------------------------------------------------------------
# `apps/web` todavía no existe (estado del repositorio el 2026-10-14), así que
# esta política está escrita a partir del stack declarado en el ADR-0008
# (Vue 3, Vite, PrimeVue, Monaco) y NO se ha probado contra ninguna página.
#
# Puntos que casi seguro habrá que revisar cuando exista la SPA:
#   · Monaco Editor carga workers; con `worker-src 'self' blob:` suele bastar,
#     pero algunas integraciones necesitan además `'wasm-unsafe-eval'`.
#   · PrimeVue inyecta estilos en línea: de ahí `'unsafe-inline'` en style-src.
#     Quitarlo exige nonces generados por la API, que es trabajo del ADR-0009.
#   · `connect-src` incluye `wss:` propio para Socket.IO (ADR-0005).
#
# Despliega primero con `Content-Security-Policy-Report-Only` y pasa a modo
# obligatorio cuando el informe esté limpio. Se deja la línea de abajo activa
# porque un despliegue sin CSP es peor que uno con CSP imperfecta, pero NO
# afirmo que no rompa nada: no la he ejecutado.
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; frame-ancestors 'none'; object-src 'none'; form-action 'self'; img-src 'self' data: blob:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; worker-src 'self' blob:; connect-src 'self' ws: wss:; upgrade-insecure-requests" always;
