# CEIBA — cabeceras de proxy comunes. Decisión C-31 + ADR-0009 §6.
#
# [NO VERIFICADO] No ejecutado: no hay Nginx en el entorno de desarrollo.
#
# POR QUÉ ESTE FICHERO EXISTE
# La sesión de CEIBA viaja en una cookie `HttpOnly; Secure; SameSite=Lax`
# (C-31). Una cookie `Secure` sólo se emite y sólo se devuelve si el servidor
# de aplicación cree estar sirviendo sobre HTTPS. Detrás de un proxy que
# termina TLS, la API ve una conexión HTTP en claro desde Nginx y, sin estas
# cabeceras, haría una de estas dos cosas, ambas rotas:
#   a) no marcar la cookie como `Secure`, degradando la decisión C-31; o
#   b) marcarla `Secure` y construir redirecciones y URLs absolutas con
#      `http://`, rompiendo el login en producción.

# ---------------------------------------------------------------------------
# 1. BORRAR lo que mande el cliente, ANTES de poner lo nuestro
# ---------------------------------------------------------------------------
# El ADR-0009 §6.1 lo exige literalmente: «Correlato obligatorio en Nginx:
# borrar las cabeceras `X-Forwarded-*` que lleguen del cliente antes de fijar
# las suyas. Si Nginx añade sin borrar, la lista queda contaminada por la
# izquierda y `trustProxy` vuelve a ser engañable.»
#
# Nginx reenvía por defecto cualquier cabecera que no se sobrescriba, así que
# las que no vayamos a fijar hay que vaciarlas explícitamente. Un
# `proxy_set_header X "";` con valor vacío hace que Nginx NO la envíe.
proxy_set_header Forwarded          "";
proxy_set_header X-Forwarded-Server "";
proxy_set_header X-Forwarded-Ssl    "";
proxy_set_header X-Forwarded-Scheme "";
proxy_set_header X-Original-URL     "";
proxy_set_header X-Rewrite-URL      "";

# ---------------------------------------------------------------------------
# 2. Poner las nuestras, que sobrescriben cualquier homónima del cliente
# ---------------------------------------------------------------------------
proxy_set_header Host               $host;
proxy_set_header X-Real-IP          $remote_addr;

# `$remote_addr` y NO `$proxy_add_x_forwarded_for`. Es la diferencia entre
# «la IP que yo he visto» y «lo que diga el cliente, más la que yo he visto».
# Nginx es el borde: aquí no hay nada aguas arriba en lo que confiar, y
# conservar la parte del cliente sólo sirve para que alguien se invente saltos
# y evada el límite por IP de C-CODE-03.
#
# Si algún día CEIBA va detrás de un balanceador que ya termina TLS, ESTA es
# la línea que cambia a `$proxy_add_x_forwarded_for`, y sólo a la vez que el
# `set_real_ip_from` de `behind-lb.conf.example`. Las dos o ninguna.
proxy_set_header X-Forwarded-For    $remote_addr;

proxy_set_header X-Forwarded-Proto  $ceiba_forwarded_proto;
proxy_set_header X-Forwarded-Host   $host;
proxy_set_header X-Forwarded-Port   $server_port;
proxy_set_header X-Request-Id       $request_id;

# ---------------------------------------------------------------------------
# 3. Requisito del lado de la API, sin el cual nada de esto sirve
# ---------------------------------------------------------------------------
# Fastify debe arrancar con `trustProxy` ACOTADO al CIDR de la red del proxy,
# nunca `true` (ADR-0009 §6.1). `compose.yaml` le pasa `CEIBA_TRUSTED_PROXIES`
# con la subred fija de la red `edge`. Con `trustProxy: true`, todo lo de
# arriba se puede volver a falsificar desde dentro de la red.

proxy_redirect off;

proxy_connect_timeout 10s;
proxy_send_timeout    60s;
proxy_read_timeout    60s;

proxy_buffer_size       16k;
proxy_buffers         8 16k;
proxy_busy_buffers_size 32k;

# NO reescribir los atributos de la cookie desde el proxy. La API es la dueña
# de `Secure`, `HttpOnly`, `SameSite` y `Path` (C-31 + ADR-0009). Si en algún
# despliegue heredado hiciera falta forzarlos, la línea sería ésta — y
# entonces habría que arreglar la API, no dejar esto puesto:
#
#   proxy_cookie_flags ~ secure httponly samesite=lax;
