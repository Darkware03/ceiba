# CEIBA — servidores HTTP y HTTPS del proxy inverso.
#
# [NO VERIFICADO] Ningún Nginx ha cargado nunca este fichero en el contenedor
# donde se escribió. La validación sintáctica real (`nginx -t`) ocurre durante
# el build de `infra/docker/proxy.Dockerfile` y en CI. Ver DESPLIEGUE.md §6.
#
# Puertos INTERNOS 8080/8443, no 80/443: así el proceso no necesita
# CAP_NET_BIND_SERVICE. La publicación al host la hace compose.yaml
# (`CEIBA_HTTP_PORT` / `CEIBA_HTTPS_PORT`; en producción, 80 y 443).

# ===========================================================================
# HTTP — sólo salud y ACME. Todo lo demás sube a HTTPS.
# ===========================================================================
server {
    listen      8080;
    listen      [::]:8080;
    server_name _;

    # Liveness del propio proxy. Sin log: lo consulta el healthcheck cada 15 s.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Reto HTTP-01 de Let's Encrypt. Tiene que viajar en claro por definición.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type "text/plain";
        try_files $uri =404;
    }

    # 308 y no 301: preserva el método y el cuerpo, así un POST redirigido no
    # se convierte en GET y el usuario no pierde la petición.
    #
    # El destino asume el puerto HTTPS estándar (443). En desarrollo, con
    # 8443 publicado, entra directamente por https://localhost:8443 — esta
    # redirección es para producción. Ver DESPLIEGUE.md §6.
    location / {
        return 308 https://$host$request_uri;
    }
}

# ===========================================================================
# HTTPS — el servicio real
# ===========================================================================
server {
    listen      8443 ssl;
    listen      [::]:8443 ssl;
    http2       on;
    server_name _;

    # Montados, nunca horneados en la imagen (§21: sin secretos en el repo).
    ssl_certificate     /etc/nginx/tls/ceiba.crt;
    ssl_certificate_key /etc/nginx/tls/ceiba.key;

    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:CEIBA_TLS:10m;
    ssl_session_timeout       1d;
    # Sin tickets: sin rotación de claves, los tickets rompen la confidencialidad
    # persistente (forward secrecy) que las suites ECDHE acaban de darnos.
    ssl_session_tickets       off;

    include /etc/nginx/snippets/security-headers.conf;

    limit_conn ceiba_conn 64;

    # -----------------------------------------------------------------------
    # Salud del proxy
    # -----------------------------------------------------------------------
    # Liveness DEL PROXY, y nada más. Responde 200 aunque la API esté caída:
    # es intencionado —mide si Nginx vive— pero NO sirve como salud del
    # sistema. La salud de la API la da su propio healthcheck en compose.yaml.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # -----------------------------------------------------------------------
    # Tiempo real — Socket.IO (ADR-0005)
    # -----------------------------------------------------------------------
    # Va ANTES que /api/ porque Socket.IO cuelga de /socket.io/, fuera del
    # prefijo de la API.
    location /socket.io/ {
        include /etc/nginx/snippets/proxy-common.conf;

        # El apretón de manos de WebSocket exige HTTP/1.1 y el par
        # Upgrade/Connection. Sin estas tres líneas el servidor responde 400 y
        # el cliente se queda reintentando para siempre: es el fallo clásico
        # de «el tiempo real no va en producción pero sí en local».
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;

        # Una conexión de colaboración vive horas. Con el timeout por defecto
        # (60 s) Nginx la cortaría y el cliente reconectaría en bucle.
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;

        # Sin buffering: el tiempo real deja de serlo si Nginx acumula.
        proxy_buffering off;

        proxy_pass http://ceiba_api;
    }

    # -----------------------------------------------------------------------
    # Flujos SSE de la API (progreso de ejecución de colecciones, ADR-0005)
    # -----------------------------------------------------------------------
    location ~ ^/api/v\d+/.*/stream$ {
        include /etc/nginx/snippets/proxy-common.conf;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";

        proxy_buffering     off;
        proxy_cache         off;
        chunked_transfer_encoding off;
        proxy_read_timeout  3600s;

        proxy_pass http://ceiba_api;
    }

    # -----------------------------------------------------------------------
    # Autenticación — límite estricto (defensa en profundidad)
    # -----------------------------------------------------------------------
    # Nginx NO sustituye al límite de intentos de la aplicación: éste es por
    # IP y una botnet lo diluye. El control real (bloqueo por cuenta y por
    # código) vive en la API, según CONTROLES.md.
    # `/?$`: sin la barra opcional, `POST /api/v1/auth/login/` esquiva el
    # límite y cae en el `location /api/` genérico, que es 20 veces más laxo.
    location ~ ^/api/v\d+/auth/(login|register|password-reset|refresh)/?$ {
        limit_req zone=ceiba_auth burst=10 nodelay;
        include /etc/nginx/snippets/proxy-common.conf;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_pass http://ceiba_api;
    }

    # Canje de código de colección privada: el objetivo natural de la fuerza
    # bruta descrita en el BRIEF §4.C.2.
    location ~ ^/api/v\d+/share/.*/(unlock|redeem)/?$ {
        limit_req zone=ceiba_share burst=5 nodelay;
        include /etc/nginx/snippets/proxy-common.conf;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_pass http://ceiba_api;
    }

    # -----------------------------------------------------------------------
    # API
    # -----------------------------------------------------------------------
    # El prefijo NO se recorta: `proxy_pass http://ceiba_api;` sin URI reenvía
    # el camino íntegro. Por tanto LA API DEBE SERVIR BAJO `/api`
    # (`app.setGlobalPrefix('api')`). Es el mismo valor que recibe la SPA en
    # `VITE_API_BASE_URL=/api`. Está anotado como HUECO en DESPLIEGUE.md §11.
    location /api/ {
        limit_req zone=ceiba_api burst=40 nodelay;
        include /etc/nginx/snippets/proxy-common.conf;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";

        # Una ejecución a través de la API puede tardar hasta
        # CEIBA_ENGINE_TIMEOUT_MS (30 s) más el ida y vuelta. 120 s deja
        # margen sin dejar sockets colgados indefinidamente.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;

        proxy_pass http://ceiba_api;
    }

    # Documentación OpenAPI (§25.9). Mismo trato que la API.
    # `^~ /docs/` y no `/docs`: el prefijo desnudo casaría también
    # `/docsecreto` o `/docs-privados`.
    location = /docs {
        return 308 /docs/;
    }

    location ^~ /docs/ {
        include /etc/nginx/snippets/proxy-common.conf;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_pass http://ceiba_api;
    }

    # -----------------------------------------------------------------------
    # Frontend
    # -----------------------------------------------------------------------
    location / {
        include /etc/nginx/snippets/proxy-common.conf;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_pass http://ceiba_web;
    }

    # -----------------------------------------------------------------------
    # Lo que NO está aquí, y es intencionado
    # -----------------------------------------------------------------------
    #   · No hay `location` hacia el motor (`engine:3001`). El motor es el
    #     único proceso con salida arbitraria a Internet; exponerlo por el
    #     proxy convertiría CEIBA en un proxy abierto. Decisión C-25.
    #   · No hay `location` hacia PostgreSQL ni Redis (§21).
    #   · No hay `ip_hash` ni sticky sessions: con `transports: ['websocket']`
    #     no hacen falta y atan el escalado (ADR-0005 §2).
}
